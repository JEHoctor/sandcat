include:
  - path: sandcat/compose-proxy.yml

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.app
    # Share the netns container's network namespace so all traffic goes through
    # the TUN device mitmproxy terminates. This container has no NET_ADMIN, so
    # processes inside cannot modify the routing or the kill switch — it can
    # see them, but not change them.
    network_mode: "service:netns"
    # Podman-only host-safety property: container-root maps to an
    # unprivileged, otherwise-unused host UID range, so if this container ever
    # runs code as root (e.g. installing a system package), that root is not
    # real root on the machine running the sandbox.
    #
    # Docker does not honor this. It accepts the field without error and
    # silently does nothing with it — Docker's actual user-namespace
    # mechanism is a daemon-wide `--userns-remap` flag in daemon.json, not a
    # per-container mode, and it has no concept of "auto". Verified directly:
    # under plain `docker compose` (no daemon-level remap configured, the
    # common case), this container's root is unmapped, real host root
    # (`uid_map: 0 0 4294967295`) — no warning, container starts normally.
    #
    # Currently dormant rather than a live gap: nothing in this image runs as
    # root at runtime today (packages install via devbox/nix into the user's
    # own home directory, no root needed), so there is no code path that
    # currently exercises the property this line claims. It matters the
    # moment that changes — e.g. giving the agent real package-manager access
    # — and only actually holds under Podman when it does.
    #
    # Unrelated to this: the kill switch's uid-based egress exemption (see
    # sandcat/scripts/netns-init.sh) does not depend on this line. It holds on
    # both engines via ordinary capability semantics — app-init.sh's
    # `exec gosu vscode "$@"` drops to a non-root user, and the kernel clears
    # effective/permitted capabilities on that transition regardless of what,
    # if anything, this container's "root" maps to on the host.
    userns_mode: "auto"
    volumes:
      # Named volume for the home directory so Claude Code auth state,
      # shell history, and other user-level config persist across rebuilds.
      - agent-home:/home/vscode
      # Shared volume from mitmproxy containing the CA cert and
      # sandcat.env (env vars + secret placeholders). Read-only — app
      # containers should never write to this.
      - mitmproxy-config:/mitmproxy-config:ro
      # Resolv.conf published by the netns container. We copy it into
      # /etc/resolv.conf in app-init.sh so DNS is addressed over the tunnel
      # rather than to the engine's embedded resolver, which the kill switch
      # blocks for everyone but the proxy.
      - netns-runtime:/run/sandcat:ro
    command: sleep infinity
    depends_on:
      # Gated on mitmproxy rather than the netns container: app-init.sh needs
      # the CA cert, which only exists once mitmproxy has started. mitmproxy in
      # turn waits for netns, so the namespace and kill switch are always in
      # place first.
      mitmproxy:
        condition: service_healthy

volumes:
  agent-home:
