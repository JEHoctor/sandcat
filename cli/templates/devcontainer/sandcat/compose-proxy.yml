services:
  # Owns the network namespace every other sandcat container joins. Creates the
  # TUN device mitmproxy terminates, points the default route at it, installs
  # the kill switch, then drops to an unprivileged UID with no capabilities and
  # sleeps to keep the namespace pinned. No user code ever runs here.
  netns:
    build:
      context: .
      dockerfile: Dockerfile.netns
    volumes:
      # Not read-only: the proxy config volume is created root-owned by the
      # engine and gets chowned to the proxy UID during init, because a
      # zero-capability mitmproxy cannot do it itself.
      - mitmproxy-config:/mitmproxy-config
      # Siblings share this namespace but not this mount namespace, so they
      # each get their own /etc/resolv.conf; this volume publishes ours for
      # them to copy on init.
      - netns-runtime:/run/sandcat
    devices:
      # Required to create the TUN device: /dev/net/tun is not present in a
      # container's /dev by default.
      - /dev/net/tun
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN # TUN device creation (TUNSETIFF), routing, iptables
      - SETUID    # dropping to the unprivileged hold UID once setup is done
      - SETGID    # ditto
      - CHOWN     # handing the shared config volume to the proxy UID
    ports:
      # mitmweb's UI. Published here rather than on the mitmproxy service
      # because that service has no namespace of its own to publish from — it
      # joins this one. The kill switch blocks the agent from reaching this
      # port over loopback, so the UI stays a host-side affordance only.
      - "8081"
    # Backstop for crashes during init. Once past init the process is a bare
    # `sleep`, so a restart here means something went badly wrong rather than
    # a routine supervision event.
    restart: unless-stopped
    healthcheck:
      # A single sentinel written at the very end of init. There is no
      # long-running service to liveness-check any more — the previous design
      # needed one because a silently dead dnsmasq would have black-holed every
      # sibling's DNS.
      test: ["CMD-SHELL", "test -f /tmp/netns-ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      # Init is a short sequence of ip/iptables calls with nothing to wait on,
      # so this is far shorter than the WireGuard setup needed. It still allows
      # for a cold VM where each forked step runs slowly.
      start_period: 30s

  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    # Joins the netns container's namespace and terminates the TUN device from
    # inside it. This is what removes the need for a tunnel transport: the
    # proxy is already in the namespace whose traffic it inspects.
    network_mode: "service:netns"
    # Starts as root only long enough to hand the TUN device node to the proxy
    # UID, then drops to it with no capabilities — see scripts/mitmproxy-init.sh
    # for why that cannot be done from the netns container. mitmproxy itself
    # runs unprivileged; this UID must stay distinct from any the agent can
    # assume, because the kill switch's egress exemption is keyed on it.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN  # handing the device node over
      - SETUID # dropping to the proxy UID
      - SETGID # ditto
    devices:
      # Needed to open the device node. Attaching to the already-created,
      # already-owned TUN interface then requires no capability.
      - /dev/net/tun
    entrypoint: ["/bin/sh", "/scripts/mitmproxy-init.sh"]
    command: mitmweb --mode tun:tun0 --web-host 0.0.0.0 --set web_password=mitmproxy --set http2=__MITM_HTTP2__ __AGENT_MITM_STREAMING_FLAGS__ -s /scripts/__AGENT_MITM_ADDON__
    volumes:
      - mitmproxy-config:/home/mitmproxy/.mitmproxy
      - ./scripts/__AGENT_MITM_ADDON__:/scripts/__AGENT_MITM_ADDON__:ro
      - ./scripts/mitmproxy_addon_common.py:/scripts/mitmproxy_addon_common.py:ro
      - ./scripts/mitmproxy-init.sh:/scripts/mitmproxy-init.sh:ro
      - ~/.config/sandcat/settings.json:/config/settings.json:ro
    depends_on:
      netns:
        condition: service_healthy
    healthcheck:
      # wireguard.conf is gone from this list: TUN mode has no keypair to
      # generate. The CA cert and dns.conf remain because the agent's init
      # blocks on the former and the addon writes the latter last, after every
      # op:// secret has resolved.
      test: ["CMD", "sh", "-c", "test -f /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem && test -f /home/mitmproxy/.mitmproxy/dns.conf"]
      interval: 2s
      timeout: 2s
      retries: 15
      # dns.conf is written only after the addon resolves every op:// secret,
      # and sequential `op read` calls to 1Password can take ~30s. Without a
      # start_period those early failures count toward retries and the proxy is
      # wrongly marked unhealthy, so dependents fail to start. Failures during
      # the start_period don't count; a single success ends it immediately.
      start_period: 90s

volumes:
  mitmproxy-config:
  netns-runtime:
